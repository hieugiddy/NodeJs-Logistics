rollback:
  stage: rollback
  image: alpine:3.20
  needs:
    - job: smoke_test
  when: on_failure
  before_script:
    - apk add --no-cache ansible openssh-client
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - ./scripts/generate-inventory.sh
    - test -n "${PREVIOUS_IMAGE_TAG}" || (echo "PREVIOUS_IMAGE_TAG is required for rollback" && exit 1)
    - ansible-playbook -i ansible/inventory/production.ini ansible/playbooks/rollback.yml -e previous_tag="${PREVIOUS_IMAGE_TAG}"
    - ./scripts/smoke-test.sh "${API_BASE_URL}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
