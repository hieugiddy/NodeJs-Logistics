---
- name: Configure Logistics Warehouse server
  hosts: app
  become: true

  roles:
    - docker

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: /opt/logistics-warehouse
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Copy production compose file
      ansible.builtin.copy:
        src: ../../docker-compose.prod.yml
        dest: /opt/logistics-warehouse/docker-compose.yml
        owner: ec2-user
        group: ec2-user
        mode: "0644"
